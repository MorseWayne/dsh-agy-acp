name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: '12.18.0'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture checks, type checks, build and tests
        run: pnpm run verify
