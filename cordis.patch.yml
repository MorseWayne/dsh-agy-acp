# dsh-agy-acp bundle patch — registers the Antigravity ACP provider plugin.
- insert:
    - id: agy-acp
      name: 'dsh-agy-acp'
      config:
        enabled: !!js "process.env.DSH_AGY_ACP_ENABLED ?? 'true'"
        agyBin: !!js "process.env.DSH_AGY_BIN ?? ''"
        # permissionMode: skip | default | accept-edits | plan
        permissionMode: !!js "process.env.DSH_AGY_ACP_MODE ?? 'accept-edits'"
        workspaceRoot: !!js "process.env.DSH_AGY_WORKSPACE_ROOT ?? ''"
        defaultModel: !!js "process.env.DSH_AGY_DEFAULT_MODEL ?? ''"
        defaultEffort: !!js "process.env.DSH_AGY_DEFAULT_EFFORT ?? ''"
